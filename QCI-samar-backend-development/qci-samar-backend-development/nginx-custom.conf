server {
    listen 8080 default_server;
    listen [::]:8080 default_server;

    root /home/site/wwwroot/public;
    index index.php index.html index.htm;
    server_name _;
    port_in_redirect off;

    # Hide nginx version
    server_tokens off;

    # Upload size limit (100MB for file uploads)
    client_max_body_size 100M;

    # Buffer sizes for request handling (matching original working config)
    # Header buffers sized for large JWT tokens
    client_header_buffer_size 4k;
    large_client_header_buffers 4 32k;
    # Body buffer large enough for form submissions with file uploads
    client_body_buffer_size 10M;

    # Timeouts
    client_body_timeout 120s;
    client_header_timeout 120s;
    send_timeout 120s;
    keepalive_timeout 120s;

    # Disable error interception - pass PHP errors through to client
    fastcgi_intercept_errors off;
    proxy_intercept_errors off;

    # Disable etag based on inode (security)
    etag off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # HSTS - Force HTTPS (Azure only, not used in local dev)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Swagger assets - must be before static files block to take precedence
    location ^~ /docs/asset/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static files - caching (excludes /docs/asset/ handled above)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|txt|woff|woff2|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # PHP handling
    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_index index.php;

        # Timeouts for PHP
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 3600;
        fastcgi_read_timeout 3600;

        # Buffer sizes
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;

        # Disable error interception for PHP
        fastcgi_intercept_errors off;
    }

    # Removed error_page directives to let PHP errors pass through
    # error_page 500 502 503 504 /50x.html;
}
