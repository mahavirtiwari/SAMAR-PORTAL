# Catch-all: reject any request not addressed to samar-staging1.qci.org.in.
# Without a default_server, nginx falls back to the first server block, which
# served the whole application over the raw IP (audit finding: direct-IP access).
#
# Lives on the VM at /etc/nginx/sites-available/00-default-deny.conf,
# symlinked into sites-enabled.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;

    # Drops the TLS handshake for unknown SNI, so no certificate is needed here
    # and IP access fails before HTTP. Requires nginx >= 1.19.4.
    ssl_reject_handshake on;

    # ssl_reject_handshake only covers the TLS stage. A client that completes a
    # handshake against the real vhost's SNI and then sends a mismatched Host
    # header is routed here afterwards, so this block must also refuse: without
    # it nginx falls back to its built-in root and serves the default
    # "Welcome to nginx!" page and version-bearing 404s.
    return 444;
}
