# =============================================================================
# QCI Samar Backend - Nginx Security Configuration
# =============================================================================
# Include this in your server block:
#   include /path/to/security.conf;
#
# Add these to your http { } block in nginx.conf for rate limiting:
#   limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
#   limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
# =============================================================================

# -------------------------------------------------------
# Hide server version
# -------------------------------------------------------
server_tokens off;

# -------------------------------------------------------
# Block access to sensitive files
# -------------------------------------------------------

# Block .env, .git, .svn, .htaccess, .htpasswd files
location ~ /\.(env|git|svn|htaccess|htpasswd) {
    deny all;
    return 404;
}

# Block all hidden files (dotfiles)
location ~ /\. {
    deny all;
    return 404;
}

# Block composer/package manager files
location ~ ^/(composer\.(json|lock)|package\.json|\.editorconfig|phpunit\.xml|\.php_cs) {
    deny all;
    return 404;
}

# Block documentation files
location ~ ^/(README|CHANGELOG|LICENSE|VERSION)\.(md|txt)$ {
    deny all;
    return 404;
}

# -------------------------------------------------------
# Block access to sensitive directories
# -------------------------------------------------------
location ~ ^/(storage|bootstrap/cache|vendor)/ {
    deny all;
    return 404;
}

# -------------------------------------------------------
# Block backup and database files
# -------------------------------------------------------
location ~ \.(bak|backup|sql|db|sqlite)$ {
    deny all;
    return 404;
}

# -------------------------------------------------------
# Limit request methods
# -------------------------------------------------------
if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
    return 405;
}

# -------------------------------------------------------
# Request size and timeout limits
# -------------------------------------------------------
client_max_body_size 20M;
client_body_timeout 30s;
client_header_timeout 30s;

# -------------------------------------------------------
# Timeout settings to mitigate Slowloris attacks
# -------------------------------------------------------
keepalive_timeout 30s;
send_timeout 30s;

# -------------------------------------------------------
# Rate limiting (apply in location blocks)
# -------------------------------------------------------
# Example usage:
# location /api/v1/auth/login {
#     limit_req zone=auth_limit burst=3 nodelay;
# }
# location /api/ {
#     limit_req zone=api_limit burst=20 nodelay;
# }
