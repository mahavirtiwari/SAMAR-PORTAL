# QCI SAMAR staging nginx site config — tracked copy of the live file.
#
# Staging nginx is SERVER-MANAGED. The live file is
# /etc/nginx/sites-enabled/qci-samar.conf on the staging VM (13.126.142.111).
# This copy exists so the config is reviewable and recoverable; editing it here
# does NOT deploy it. To change: edit here, scp to the VM, `sudo nginx -t`, then
# `sudo systemctl reload nginx`.
#
# Cache-Control is set with add_header only, never alongside `expires` — the two
# together emit two Cache-Control headers on the same response. [BUG-07226]
server {
    listen 80;
    server_name samar-staging1.qci.org.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name samar-staging1.qci.org.in;

    ssl_certificate /etc/letsencrypt/live/samar-staging1.qci.org.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/samar-staging1.qci.org.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 100M;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 32k;
    client_body_buffer_size 10M;
    client_body_timeout 120s;
    client_header_timeout 120s;
    send_timeout 120s;
    keepalive_timeout 120s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security headers are included per-location, NOT here: a server-level include
    # is inherited by /api/ and the PHP handler, which duplicates the headers
    # Laravel's SecurityHeaders middleware already sets on every API response.
    # nginx owns headers for what it serves directly; Laravel owns /api.

    # Block Swagger docs
    location ^~ /docs {
        include /etc/nginx/snippets/qci-security-headers.conf;
        return 404;
    }
    location ^~ /api/documentation {
        include /etc/nginx/snippets/qci-security-headers.conf;
        return 404;
    }

    # Laravel Backend - API routes
    location ^~ /api/ {
        root /var/www/qci-samar/backend/public;
        index index.php;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel Backend - Health check
    location = /up {
        root /var/www/qci-samar/backend/public;
        rewrite ^ /index.php last;
    }

    # PHP-FPM handler
    location ~ \.php$ {
        root /var/www/qci-samar/backend/public;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 3600;
        fastcgi_read_timeout 3600;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Backend public images (used in emails)
    location ^~ /images/ {
        root /var/www/qci-samar/backend/public;
        try_files $uri =404;
        # expires intentionally omitted - it emits a second Cache-Control header
        add_header Cache-Control "public, max-age=2592000" always;
        include /etc/nginx/snippets/qci-security-headers.conf;
    }

    # Storage - Laravel public storage
    location ^~ /storage/ {
        alias /var/www/qci-samar/backend/storage/app/public/;
        try_files $uri $uri/ =404;
        # expires intentionally omitted - it emits a second Cache-Control header
        add_header Cache-Control "public, max-age=2592000" always;
        include /etc/nginx/snippets/qci-security-headers.conf;
    }

    # React Frontend
    root /var/www/qci-samar/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/qci-security-headers.conf;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/qci-samar/frontend;
        # expires intentionally omitted - it emits a second Cache-Control header
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/qci-security-headers.conf;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
