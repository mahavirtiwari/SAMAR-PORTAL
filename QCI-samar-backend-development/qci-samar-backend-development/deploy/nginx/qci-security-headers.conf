# QCI SAMAR security headers — canonical set served on staging.
#
# Staging nginx is SERVER-MANAGED (not applied by deploy-staging.sh). The live
# site config is /etc/nginx/sites-enabled/qci-samar.conf on the staging VM
# (13.232.227.197), and it `include`s this snippet from /etc/nginx/snippets/.
# This file is the tracked source of truth for the header set. [TASK-05278]
#
# IMPORTANT: nginx drops ALL inherited add_headers in any location that defines
# its own add_header, so this snippet must be `include`d in the server block AND
# in every location that sets its own header (the frontend `location /`, the
# static-asset location, `/images/`, `/storage/`). To change the headers: edit
# here, scp to /etc/nginx/snippets/qci-security-headers.conf, `sudo nginx -t`,
# then `sudo systemctl reload nginx`.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "0" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(self), payment=(), usb=(), serial=(), bluetooth=(), display-capture=()" always;
# connect-src lists only origins staging actually calls. The frontend's staging
# BASE_URL is https://qcisamartest.qci.org.in/api/v1 — this origin — so 'self'
# already covers it. The dev API host must NOT be listed here: it let a compromised
# script on staging reach development infrastructure. [BUG-07225]
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://qcisamartest.qci.org.in; worker-src 'none'; manifest-src 'self'; media-src 'none'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
