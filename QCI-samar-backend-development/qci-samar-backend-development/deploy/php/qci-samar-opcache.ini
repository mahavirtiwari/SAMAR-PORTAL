; OPcache for QCI SAMAR. Copy to /etc/php/8.4/fpm/conf.d/99-qci-samar-opcache.ini
; and reload php8.4-fpm. The deploy pipelines reload php-fpm after every rsync,
; which is what makes validate_timestamps=0 safe (code is re-read on reload).
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.jit=tracing
opcache.jit_buffer_size=64M
