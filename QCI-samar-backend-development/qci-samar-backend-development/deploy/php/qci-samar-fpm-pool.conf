; PHP-FPM pool tuning for QCI SAMAR. Server-managed: copy over the [www] pool
; settings in /etc/php/8.4/fpm/pool.d/www.conf, then `sudo systemctl reload php8.4-fpm`.
;
; Size pm.max_children from measured memory, not a guess:
;   ps -ylC php-fpm8.4 --sort:rss | awk 'NR>1 {s+=$8; n++} END {print s/n/1024 " MB avg"}'
;   max_children = (RAM - MySQL buffer pool - ~1 GB for OS/nginx) / avg worker MB
; Example: 16 GB VM, 6 GB buffer pool, ~80 MB/worker -> (16-6-1)*1024/80 ≈ 110.
[www]
pm = dynamic
pm.max_children = 60
pm.start_servers = 12
pm.min_spare_servers = 8
pm.max_spare_servers = 20
; Recycle workers to contain slow leaks in long-lived processes.
pm.max_requests = 500
; Hard stop for a stuck request (PDFs/emails now run on the queue worker).
request_terminate_timeout = 300s
; Log the stack of anything slower than 5 s to find hot spots under load.
request_slowlog_timeout = 5s
slowlog = /var/log/php8.4-fpm-slow.log
