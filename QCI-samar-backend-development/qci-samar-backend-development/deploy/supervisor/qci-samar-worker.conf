; Queue workers for QCI SAMAR (emails on status changes, committee close-out
; PDFs/emails, Business Central pushes). Installed by deploy/remote/install-workers.sh,
; which fills in __APP_ENV__ and __BACKEND_DIR__.
[program:qci-samar-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php __BACKEND_DIR__/artisan queue:work --queue=default --sleep=3 --tries=3 --max-time=3600 --memory=256
directory=__BACKEND_DIR__
environment=APP_ENV="__APP_ENV__"
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=1810
redirect_stderr=true
stdout_logfile=__BACKEND_DIR__/storage/logs/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
