# SAMAR dev security headers — kept identical to the staging set
# (qci-samar-backend/deploy/nginx/qci-security-headers.conf) apart from
# connect-src, so security testing on staging is representative of dev.
#
# nginx drops ALL inherited add_headers in any location that defines its own,
# so this snippet must be included in the server block AND in every location
# that sets a header of its own (currently `location /assets/` and `location /`,
# both of which set Cache-Control).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "0" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(self), payment=(), usb=(), serial=(), bluetooth=(), display-capture=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://samar-api.webority.dev; worker-src 'none'; manifest-src 'self'; media-src 'none'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
