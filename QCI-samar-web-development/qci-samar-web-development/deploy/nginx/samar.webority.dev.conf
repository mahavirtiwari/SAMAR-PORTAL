# SAMAR dev nginx site config — tracked copy of the live file.
#
# The dev VM's nginx is SERVER-MANAGED. The live file is
# /etc/nginx/sites-enabled/samar.webority.dev on vm-webhost-dev-cin-01
# (20.204.69.31), and samar-security-headers.conf beside this one lives at
# /etc/nginx/snippets/. Editing here does NOT deploy: scp to the VM,
# `sudo nginx -t`, then `sudo systemctl reload nginx`.
#
# Dev serves build/ statically, exactly like staging — no Node, no pm2. Keep the
# header set in step with qci-samar-backend/deploy/nginx/qci-security-headers.conf
# so security testing on staging stays representative of dev. [BUG-07226]
server {
  listen 80; listen [::]:80;
  server_name samar.webority.dev;
  client_max_body_size 100M;
  listen 443 ssl;
  listen [::]:443 ssl;
  include snippets/webority-ssl.conf;

  # Static SPA served straight from nginx, same as staging. There is no Node
  # process and no pm2 app: the build output is the whole deployment.
  root /data/www/samar.webority.dev/build;
  index index.html;

  # Hardening locations copied from snippets/security.conf, which is not included
  # here because it also sends X-Frame-Options SAMEORIGIN and would contradict the
  # DENY below.
  location ~ /\. { deny all; return 404; }
  location ~* ^/(adminer|phpmyadmin|pma|dbadmin|myadmin|mysqladmin|websql|sqladmin|shell|webshell|filemanager|c99|r57|wso)[^/]*\.php$ { return 404; }

  include snippets/samar-security-headers.conf;

  # Vite content-hashes these, so they can be cached forever. try_files ... =404
  # is load-bearing: a missing hashed asset must 404, never fall back to
  # index.html, or a stale bundle silently receives HTML with a 200. [BUG-07212]
  location /assets/ {
    include snippets/samar-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # index.html and SPA routes must never be cached, or clients keep loading an
  # old document that references deleted asset hashes.
  location / {
    include snippets/samar-security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}
